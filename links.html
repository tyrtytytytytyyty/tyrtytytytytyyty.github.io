<head>

<title>tyy — Links</title>
<meta name="description" content="Everything in one place — where to find me and what I'm building.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .links-wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 72px 20px 60px;
    display: flex; flex-direction: column; align-items: center;
  }
  .links-wrap .logo-mark {
    width: 56px; height: 56px; border-radius: 16px;
    background: #fff; color: #07070a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500;
  }
  .links-name {
    margin-top: 18px;
    font-size: 26px; font-weight: 500; letter-spacing: -0.5px;
  }
  .links-tagline {
    margin-top: 6px;
    font-size: 13px; color: var(--text-secondary);
    font-family: 'DM Mono', monospace;
  }
  .links-stack {
    margin-top: 36px; width: 100%;
    display: flex; flex-direction: column; gap: 12px;
  }
  .link-card {
    display: flex; align-items: center; gap: 14px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    text-decoration: none; color: var(--text-primary);
    transition: border-color .2s ease, transform .2s ease, background .2s ease;
  }
  .link-card:hover {
    border-color: var(--border-mid);
    background: var(--surface2);
    transform: translateY(-2px);
  }
  .link-card.featured { border-color: rgba(240,180,41,0.35); }
  .link-card.featured:hover { border-color: rgba(240,180,41,0.6); }
  .link-icon {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 11px;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary);
  }
  .link-card.featured .link-icon { color: var(--star-on); }
  .link-icon svg { width: 17px; height: 17px; }
  .link-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .link-title { font-size: 14.5px; font-weight: 500; }
  .link-sub {
    font-size: 12px; color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .link-tag {
    margin-left: auto; flex-shrink: 0;
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--star-on);
    border: 1px solid rgba(240,180,41,0.35);
    border-radius: 99px; padding: 3px 9px;
  }
  .link-tag.muted { color: var(--text-secondary); border-color: var(--border-mid); }

  /* hero card — the guide (top billing) */
  .link-card.hero {
    flex-direction: column; align-items: flex-start; gap: 12px;
    padding: 20px;
    border-color: rgba(240,180,41,0.45);
    background: linear-gradient(160deg, rgba(240,180,41,0.07), var(--surface) 55%);
    box-shadow: 0 0 34px rgba(240,180,41,0.08);
  }
  .link-card.hero:hover { border-color: rgba(240,180,41,0.75); transform: translateY(-2px); }
  .hero-top { display: flex; align-items: center; gap: 10px; width: 100%; }
  .hero-diamond { color: var(--star-on); font-size: 17px; }
  .hero-title { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .hero-sub { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; }
  .hero-cta {
    margin-top: 2px;
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px;
    color: #07070a; background: var(--star-on);
    border-radius: 9px; padding: 8px 14px; font-weight: 500;
  }

  /* portfolio card — elevated */
  .link-card.portfolio {
    border-color: rgba(255,255,255,0.22);
    background: linear-gradient(160deg, rgba(255,255,255,0.05), var(--surface) 60%);
  }
  .link-card.portfolio:hover { border-color: rgba(255,255,255,0.4); }
  .link-card.portfolio .link-icon {
    background: #fff; color: #07070a; border-color: #fff;
  }
  .link-card.portfolio .link-title { font-size: 15.5px; font-weight: 600; }
  .link-arrow { margin-left: auto; color: var(--text-secondary); font-size: 15px; }

  /* socials — tucked into a compact row */
  .socials-label {
    margin: 22px 0 10px; width: 100%;
    display: flex; align-items: center; gap: 12px;
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase; color: var(--text-muted);
  }
  .socials-label::before, .socials-label::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }
  .socials-row { display: flex; gap: 10px; width: 100%; }
  .social-chip {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 10px;
    text-decoration: none; color: var(--text-secondary);
    font-size: 12.5px;
    transition: border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .social-chip:hover { border-color: var(--border-mid); color: var(--text-primary); transform: translateY(-1px); }
  .social-chip svg { width: 15px; height: 15px; flex-shrink: 0; }
  .links-footer {
    margin-top: 40px;
    font-size: 11.5px; color: var(--text-muted);
    font-family: 'DM Mono', monospace;
  }
  .links-footer a { color: var(--text-secondary); text-decoration: none; }
</style>
</head>
