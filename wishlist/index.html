<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Christmas Wishlist</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --text:#1b1b1d; --muted:#65656b; --border:#e1dfd9;
  --accent:#b8860b; --accent-text:#ffffff; --photo:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#07070a; --surface:#121217; --text:#f0f0ee; --muted:#a2a2a8; --border:#26262d; --accent:#f0b429; --accent-text:#14110a; }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
header.top{padding:8px 0 18px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:15px;padding:10px 0;min-height:44px}
.crumb:hover{color:var(--text)}
h2{font-size:24px;line-height:1.2;letter-spacing:-.01em;margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
.card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.985)}
.card .ph{aspect-ratio:1/1;background:var(--photo);display:flex;align-items:center;justify-content:center}
.card .ph img{width:100%;height:100%;object-fit:contain;display:block}
.card .meta{padding:10px 12px 12px}
.card .nm{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{margin-top:4px;color:var(--muted);font-size:14px}
.cat .ph{aspect-ratio:4/3}
.cat .nm{font-size:16px}
.cat.soon{border-style:dashed;background:transparent}
.cat.soon .ph{background:transparent;color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:28px 0}
/* listing */
.gallery{position:relative;background:var(--photo);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.9);color:#111;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.arrow.l{left:8px}.arrow.r{right:8px}
.arrow[hidden]{display:none}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 64px;height:64px;border-radius:10px;border:2px solid var(--border);background:var(--photo);padding:2px;cursor:pointer}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:contain;display:block;border-radius:6px}
.info{margin-top:18px}
.info h2{margin-bottom:8px}
.price{font-size:26px;font-weight:700;margin-top:14px}
.desc{color:var(--text);font-size:17px;line-height:1.55}
.buy{display:flex;align-items:center;justify-content:center;min-height:56px;margin-top:16px;border-radius:14px;background:var(--accent);color:var(--accent-text);font-size:18px;font-weight:700;text-decoration:none}
.buy:active{opacity:.85}
.small{color:var(--muted);font-size:13px;margin-top:10px;text-align:center}
.note{color:var(--muted);font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Christmas Wishlist</h1>
    <p class="sub">Tap a category to see ideas.</p>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<script>
(function(){
  var app=document.getElementById('app'), data=null;
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function money(n){return '$'+Number(n).toFixed(2)}
  function priceText(it){return it.price==null?'Check price':money(it.price)}
  function itemsIn(c){return data.items.filter(function(i){return i.category===c})}
  function img(it,n){return 'img/'+it.images[n||0]}

  function home(){
    document.title='Christmas Wishlist';
    var h='<div class="grid">';
    data.categories.forEach(function(c){
      var its=itemsIn(c.id);
      if(!its.length){
        h+='<a class="card cat soon" href="#/c/'+c.id+'"><div class="ph">Coming soon</div><div class="meta"><div class="nm">'+esc(c.name)+'</div></div></a>';
      }else{
        h+='<a class="card cat" href="#/c/'+c.id+'"><div class="ph"><img src="'+img(its[0])+'" alt="" loading="lazy"></div><div class="meta"><div class="nm">'+esc(c.name)+'</div><div class="pr">'+its.length+(its.length===1?' item':' items')+'</div></div></a>';
      }
    });
    app.innerHTML=h+'</div>';
  }

  function category(id){
    var c=data.categories.filter(function(x){return x.id===id})[0];
    if(!c) return home();
    document.title=c.name+' | Christmas Wishlist';
    var its=itemsIn(id);
    var h='<a class="crumb" href="#/">&#8592; All categories</a><h2>'+esc(c.name)+'</h2>';
    if(!its.length){ h+='<p class="empty">Coming soon.</p>'; }
    else{
      h+='<div class="grid">';
      its.forEach(function(it){
        h+='<a class="card" href="#/i/'+it.id+'"><div class="ph"><img src="'+img(it)+'" alt="" loading="lazy"></div><div class="meta"><div class="nm">'+esc(it.name)+'</div><div class="pr">'+priceText(it)+'</div></div></a>';
      });
      h+='</div>';
    }
    app.innerHTML=h;
  }

  function item(id){
    var it=data.items.filter(function(x){return x.id===id})[0];
    if(!it) return home();
    var c=data.categories.filter(function(x){return x.id===it.category})[0];
    document.title=it.name+' | Christmas Wishlist';
    var multi=it.images.length>1;
    var h='<a class="crumb" href="#/c/'+it.category+'">&#8592; '+esc(c?c.name:'Back')+'</a>';
    h+='<div class="gallery"><div class="track" id="track">';
    it.images.forEach(function(f,i){h+='<div class="slide"><img src="img/'+f+'" alt="'+esc(it.name)+' photo '+(i+1)+'"'+(i?' loading="lazy"':'')+'></div>'});
    h+='</div>';
    if(multi) h+='<button class="arrow l" id="pv" aria-label="Previous image" hidden>&#8249;</button><button class="arrow r" id="nx" aria-label="Next image">&#8250;</button>';
    h+='</div>';
    if(multi){
      h+='<div class="thumbs" id="thumbs">';
      it.images.forEach(function(f,i){h+='<button type="button" aria-label="Show image '+(i+1)+'" data-i="'+i+'"'+(i===0?' class="on"':'')+'><img src="img/'+f+'" alt=""></button>'});
      h+='</div>';
    }
    h+='<div class="info"><h2>'+esc(it.name)+'</h2><p class="desc">'+esc(it.desc)+'</p>';
    h+='<p class="price">'+priceText(it)+'</p>';
    if(it.note) h+='<p class="note">'+esc(it.note)+'</p>';
    h+='<a class="buy" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">Buy at '+esc(it.store)+'</a>';
    h+='<p class="small">Price checked '+esc(data.checked)+'</p>';
    if(it.alt) h+='<p class="small"><a href="'+esc(it.alt.url)+'" target="_blank" rel="noopener noreferrer">Also at '+esc(it.alt.store)+'</a></p>';
    h+='</div>';
    app.innerHTML=h;
    if(multi) wire(it.images.length);
  }

  function wire(n){
    var tr=document.getElementById('track'), pv=document.getElementById('pv'), nx=document.getElementById('nx'), th=document.getElementById('thumbs');
    function cur(){return Math.round(tr.scrollLeft/tr.clientWidth)}
    function go(i){i=Math.max(0,Math.min(n-1,i));tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'})}
    function sync(){var i=cur();pv.hidden=i<=0;nx.hidden=i>=n-1;
      [].forEach.call(th.children,function(b,k){b.classList.toggle('on',k===i)});}
    tr.addEventListener('scroll',function(){window.requestAnimationFrame(sync)});
    pv.addEventListener('click',function(){go(cur()-1)});
    nx.addEventListener('click',function(){go(cur()+1)});
    th.addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(+b.getAttribute('data-i'))});
    document.onkeydown=function(e){if(e.key==='ArrowLeft')go(cur()-1);if(e.key==='ArrowRight')go(cur()+1)};
  }

  function route(){
    if(!data) return;
    document.onkeydown=null;
    var p=(location.hash||'#/').replace(/^#\/?/,'').split('/');
    if(p[0]==='c'&&p[1]) category(p[1]);
    else if(p[0]==='i'&&p[1]) item(p[1]);
    else home();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);
  fetch('items.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){data=d;route()})
    .catch(function(){app.innerHTML='<p class="empty">Could not load the list. Try refreshing.</p>'});
})();
</script>
</body>
</html>
